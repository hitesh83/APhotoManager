// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgraded to match Gradle 8.13
        classpath 'com.android.tools.build:gradle:8.13.0'

        // Markdown in javadoc (Note: older versions like 1.3 may have compatibility warnings on Java 17+)
        classpath 'ch.raffael.pegdown-doclet:pegdown-doclet:1.3'

        // Upgraded Pitest plugin for Gradle 8 compatibility
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// Markdown in javadoc & mutation testing plugins
apply plugin: 'ch.raffael.pegdown-doclet'
apply plugin: 'info.solidsoft.pitest'